var converter = new showdown.Converter();
var html = converter.makeHtml(md);
var placeholder = document.getElementById('placeholder');
placeholder.innerHTML = html;

var headings = Array.from(placeholder.querySelectorAll('h1'));
var indexHeading = headings.find(heading => heading.textContent.trim() === 'Index');

if (indexHeading) {
  var indexAnchorParagraph = indexHeading.previousElementSibling;
  if (indexAnchorParagraph && indexAnchorParagraph.querySelector('a[name]')) {
    indexAnchorParagraph.remove();
  }
  indexHeading.id = 'index';
  indexHeading.setAttribute('tabindex', '-1');

  var nav = document.createElement('nav');
  nav.className = 'index-nav';
  nav.setAttribute('aria-labelledby', 'index');

  var indexList = document.createElement('ul');
  nav.appendChild(indexList);
  indexHeading.after(nav);

  headings.forEach(heading => {
    if (heading === indexHeading) return;

    var prev = heading.previousElementSibling;
    var anchor = prev && prev.querySelector('a[name]');
    var id = anchor && anchor.getAttribute('name');

    if (anchor && prev.tagName === 'P' && prev.textContent.trim() === '') {
      prev.remove();
    }

    if (!id) {
      id = heading.textContent.trim().toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
    }

    heading.id = id;
    heading.setAttribute('tabindex', '-1');

    var item = document.createElement('li');
    var link = document.createElement('a');
    link.href = `#${id}`;
    link.textContent = heading.textContent.trim();
    item.appendChild(link);
    indexList.appendChild(item);
  });
}

placeholder.querySelectorAll('a[href="#index"]').forEach(link => {
  link.classList.add('return-link');
});
